<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Управление Роботом</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            padding: 15px;
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            /* Отключаем жесты обновления страницы на смартфонах */
            overscroll-behavior-y: contain;
        }
        h1 {
            color: #333;
            margin: 10px 0 20px 0;
            font-size: 24px;
            text-align: center;
        }
        .container {
            display: flex;
            flex-direction: row;
            gap: 30px;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
            max-width: 1000px;
        }
        .controls-block {
            display: flex;
            flex-direction: column;
            gap: 20px;
            align-items: center;
            width: 100%;
            max-width: 320px;
        }

        /* Круглый джойстик */
        .joystick-zone {
            width: 220px;
            height: 220px;
            background: #e0e0e0;
            border-radius: 50%;
            position: relative;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.15), 0 4px 6px rgba(0,0,0,0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            touch-action: none; /* Запрещает скролл экрана при перетаскивании джойстика */
        }
        .joystick-handle {
            width: 80px;
            height: 80px;
            background: radial-gradient(circle, #007bff 0%, #0056b3 100%);
            border-radius: 50%;
            position: absolute;
            box-shadow: 0 6px 12px rgba(0,0,0,0.3);
            cursor: grab;
            transition: transform 0.05s ease;
        }
        .joystick-handle:active {
            cursor: grabbing;
            background: radial-gradient(circle, #0056b3 0%, #003d82 100%);
        }

        /* Блок управления скоростью */
        .speed-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .speed-control label {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
        .speed-control input[type="range"] {
            width: 100%;
            height: 25px; /* Увеличено для удобного нажатия пальцем */
            cursor: pointer;
        }

        /* Блок камеры */
        .camera-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 450px;
        }
        .viewfinder {
            width: 100%;
            aspect-ratio: 4 / 3; /* Автоматическое масштабирование под экран */
            max-width: 450px;
            border: 3px dashed #ccc;
            border-radius: 12px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #666;
            position: relative;
            box-sizing: border-box;
        }
        .viewfinder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .cam-btn {
            font-size: 16px;
            padding: 14px 24px;
            background-color: #28a745;
            border: none;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%; /* Растягивается по ширине на мобильных */
            max-width: 300px;
            font-weight: bold;
            -webkit-tap-highlight-color: transparent;
        }
        .cam-btn:active {
            background-color: #1e7e34;
        }

        /* Адаптивный дизайн для мобильных экранов (смартфоны и узкие планшеты) */
        @media (max-width: 768px) {
            h1 {
                font-size: 20px;
                margin-bottom: 15px;
            }
            .container {
                flex-direction: column; /* Элементы выстраиваются вертикально */
                gap: 20px;
                align-items: center;
            }
            .camera-block {
                order: -1; /* Видеопоток встает НАВЕРХ, чтобы было видно куда едет робот */
            }
            .joystick-zone {
                width: 200px;
                height: 200px;
            }
            .joystick-handle {
                width: 74px;
                height: 74px;
            }
        }
    </style>
</head>
<body>

    <h1>Пульт управления роботом</h1>

    <div class="container">
        <!-- Блок управления: Джойстик и Скорость -->
        <div class="controls-block">
            <div class="joystick-zone" id="zone">
                <div class="joystick-handle" id="handle"></div>
            </div>

            <!-- Интерактивный ползунок скорости -->
            <div class="speed-control">
                <label for="speed-slider">Макс. Скорость: <span id="speed-value">100</span></label>
                <input type="range" id="speed-slider" min="0" max="100" value="100" oninput="changeSpeedLive(this.value)">
            </div>
        </div>

        <!-- Блок камеры: Видеотрансляция -->
        <div class="camera-block">
            <div class="viewfinder">
                <img id="robot-frame" src="" onerror="this.style.display='none'; document.getElementById('placeholder').style.display='block';" onload="this.style.display='block'; document.getElementById('placeholder').style.display='none';" alt="Кадр нейросети">
                <span id="placeholder" style="display: none;">Подключение к камере...</span>
            </div>
            <button class="cam-btn" onclick="restartStream()">🔄 Переподключить поток</button>
        </div>
    </div>

    <script>
        function drag(e) {
    if (!isDragging) return;
    if (e.cancelable) e.preventDefault();

    // Корректное чтение координат как для мыши, так и для тач-событий
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

    const zoneRect = zone.getBoundingClientRect();
    const centerX = zoneRect.left + zoneRect.width / 2;
    const centerY = zoneRect.top + zoneRect.height / 2;

    let deltaX = clientX - centerX;
    let deltaY = clientY - centerY;
    const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);

    if (distance > maxRadius) {
        deltaX = (deltaX / distance) * maxRadius;
        deltaY = (deltaY / distanceё) * maxRadius;
    }

    updateHandlePosition(deltaX, deltaY);
    processJoystickDirection(deltaX, deltaY);
}


        const ROBOT_BASE_URL = window.location.origin;
        let currentSpeed = 100;
        let pinCode = prompt("Введите код безопасности для управления роботом:", "");

        const zone = document.getElementById('zone');
        const handle = document.getElementById('handle');
        let isDragging = false;
        let lastCommand = 's';

        const activeKeys = { w: false, a: false, s: false, d: false };
        const maxRadius = 70; // Ограничение радиуса адаптировано под размер мобильного круга

        // Запрет контекстного меню для предотвращения ложных зажатий на смартфонах
        window.addEventListener('contextmenu', e => e.preventDefault());

        // Привязка событий мыши и тача к круглому джойстику
        zone.addEventListener('mousedown', startDrag);
        window.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', stopDrag);

        zone.addEventListener('touchstart', startDrag, { passive: false });
        window.addEventListener('touchmove', drag, { passive: false });
        window.addEventListener('touchend', stopDrag);

        function startDrag(e) {
            isDragging = true;

            if (e.cancelable) {
                e.preventDefault();
            }

            drag(e);
        }

        function stopDrag() {
            if (!isDragging) return;
            isDragging = false;
            resetJoystick();
        }

        function updateHandlePosition(x, y) {
            handle.style.transform = `translate(${x}px, ${y}px)`;
        }

        function resetJoystick() {
            updateHandlePosition(0, 0);
            sendRobotCommand('s');
        }

        function processJoystickDirection(x, y) {
            const threshold = 15; // Мертвая зона
            if (Math.sqrt(x*x + y*y) < threshold) {
                sendRobotCommand('s');
                return;
            }

            let angle = Math.atan2(-y, x) * (180 / Math.PI);
            if (angle < 0) angle += 360;

            if (angle >= 45 && angle < 135) {
                sendRobotCommand('f'); // Вперед
            } else if (angle >= 135 && angle < 225) {
                sendRobotCommand('l'); // Лево
            } else if (angle >= 225 && angle < 315) {
                sendRobotCommand('b'); // Назад
            } else {
                sendRobotCommand('r'); // Право
            }
        }

        // Обработка клавиатуры WASD
        window.addEventListener('keydown', (e) => {
            if (e.repeat) return;
            const key = e.key.toLowerCase();
            if (key in activeKeys) {
                activeKeys[key] = true;
                updateKeyboardJoystick();
            }
        });

        window.addEventListener('keyup', (e) => {
            const key = e.key.toLowerCase();
            if (key in activeKeys) {
                activeKeys[key] = false;
                updateKeyboardJoystick();
            }
        });

        function updateKeyboardJoystick() {
            if (isDragging) return;

            let kX = 0;
            let kY = 0;

            if (activeKeys.w) kY -= maxRadius;
            if (activeKeys.s) kY += maxRadius;
            if (activeKeys.a) kX -= maxRadius;
            if (activeKeys.d) kX += maxRadius;

            updateHandlePosition(kX, kY);
            processJoystickDirection(kX, kY);
        }

        function sendRobotCommand(command) {
            if (command === lastCommand) return;
            lastCommand = command;

            const url = command === 's'
                ? `${ROBOT_BASE_URL}/${command}?code=${pinCode}`
                : `${ROBOT_BASE_URL}/${command}?speed=${currentSpeed}&code=${pinCode}`;

            fetch(url).catch(err => console.error("Ошибка передачи:", err));
        }

        function changeSpeedLive(val) {
            currentSpeed = val;
            document.getElementById('speed-value').innerText = val;

            fetch(`${ROBOT_BASE_URL}/set_speed?speed=${val}&code=${pinCode}`)
                .catch(err => console.error("Ошибка изменения скорости:", err));
        }

        function restartStream() {
            const img = document.getElementById('robot-frame');
            const placeholder = document.getElementById('placeholder');

            placeholder.innerText = "Переподключение...";
            placeholder.style.display = 'block';
            img.style.display = 'none';

            img.src = `${ROBOT_BASE_URL}/video_feed?code=${pinCode}&t=${new Date().getTime()}`;
        }

        window.onload = restartStream;
    </script>
</body>
</html>
