<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление Роботом</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            padding: 20px;
        }
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        .container {
            display: flex;
            flex-direction: row;
            gap: 40px;
            align-items: center;
        }
        .controls-block {
            display: flex;
            flex-direction: column;
            gap: 25px;
            align-items: center;
        }
        .joystick {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 15px;
        }
        button {
            font-size: 24px;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            background-color: #007bff;
            color: white;
            cursor: pointer;
            height: 100px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background-color 0.1s, transform 0.05s;
        }
        button:active {
            background-color: #0056b3;
            transform: scale(0.98);
        }
        .empty {
            background: none;
            box-shadow: none;
            cursor: default;
        }
        .empty:active {
            transform: none;
        }
        .stop-btn {
            background-color: #dc3545;
        }
        .stop-btn:active {
            background-color: #bd2130;
        }

        /* Блок управления скоростью */
        .speed-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            box-sizing: border-box;
        }
        .speed-control label {
            font-weight: bold;
            color: #333;
            font-size: 16px;
        }
        .speed-control input[type="range"] {
            width: 100%;
            cursor: pointer;
        }

        /* Блок камеры */
        .camera-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .viewfinder {
            width: 400px;
            height: 300px;
            border: 3px dashed #ccc;
            border-radius: 12px;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            color: #666;
            position: relative;
        }
        .viewfinder img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .cam-btn {
            font-size: 16px;
            padding: 12px 24px;
            background-color: #28a745;
            height: auto;
        }
        .cam-btn:active {
            background-color: #1e7e34;
        }
    </style>
</head>
<body>

    <h1>Пульт управления роботом</h1>

    <div class="container">
        <!-- Левая колонка: Джойстик и Скорость -->
        <div class="controls-block">
            <div class="joystick">
                <button class="empty"></button>
                <button onclick="sendCommand('l')">▲</button>
                <button class="empty"></button>

                <button onclick="sendCommand('b')">◀</button>
                <button class="stop-btn" onclick="sendCommand('s')">■</button>
                <button onclick="sendCommand('f')">▶</button>

                <button class="empty"></button>
                <button onclick="sendCommand('r')">▼</button>
                <button class="empty"></button>
            </div>

            <!-- Интерактивный ползунок скорости -->
            <div class="speed-control">
                <label for="speed-slider">Скорость: <span id="speed-value">100</span></label>
                <input type="range" id="speed-slider" min="0" max="200" value="100" oninput="changeSpeedLive(this.value)">
            </div>
        </div>

        <!-- Правая колонка: Видеотрансляция -->
        <div class="camera-block">
            <div class="viewfinder">
                <img id="robot-frame" src="" onerror="this.style.display='none'; document.getElementById('placeholder').style.display='block';" onload="this.style.display='block'; document.getElementById('placeholder').style.display='none';" alt="Кадр нейросети">
                <span id="placeholder" style="display: none;">Подключение к камере...</span>
            </div>
            <button class="cam-btn" onclick="restartStream()">🔄 Переподключить поток</button>
        </div>
    </div>

    <script>
        const ROBOT_BASE_URL = window.location.origin;
        let currentSpeed = 100;

        // Запрос пин-кода при входе на страницу
        let pinCode = prompt("Введите код безопасности для управления роботом:", "");

        // Мгновенное изменение скорости при перетаскивании ползунка
        function changeSpeedLive(val) {
            currentSpeed = val;
            document.getElementById('speed-value').innerText = val;

            fetch(`${ROBOT_BASE_URL}/set_speed?speed=${val}&code=${pinCode}`)
                .catch(err => console.error("Ошибка изменения скорости:", err));
        }

        // Отправка команд движения
        function sendCommand(endpoint) {
            const url = endpoint === 's'
                ? `${ROBOT_BASE_URL}/${endpoint}?code=${pinCode}`
                : `${ROBOT_BASE_URL}/${endpoint}?speed=${currentSpeed}&code=${pinCode}`;

            fetch(url).catch(err => console.error("Ошибка команды:", err));
        }

        // Переподключение MJPEG потока видео с передачей пин-кода
        function restartStream() {
            const img = document.getElementById('robot-frame');
            const placeholder = document.getElementById('placeholder');

            placeholder.innerText = "Переподключение...";
            placeholder.style.display = 'block';
            img.style.display = 'none';

            // Передаем параметр code прямо в URL картинки/потока
            img.src = `${ROBOT_BASE_URL}/video_feed?code=${pinCode}&t=${new Date().getTime()}`;
        }

        // Инициализация видеопотока при загрузке страницы
        window.onload = restartStream;
    </script>
</body>
</html>
