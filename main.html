<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Управление Роботом</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            background-color: #f0f2f5;
            padding: 20px;
        }
        .container { display: flex; flex-direction: row; gap: 40px; align-items: center; }
        .controls-block { display: flex; flex-direction: column; gap: 25px; align-items: center; }
        .joystick { display: grid; grid-template-columns: repeat(3, 100px); gap: 15px; }
        button {
            font-size: 24px; font-weight: bold; border: none; border-radius: 12px;
            background-color: #007bff; color: white; cursor: pointer; height: 100px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        button:active { background-color: #0056b3; }
        .empty { background: none; box-shadow: none; cursor: default; }
        .stop-btn { background-color: #dc3545; }

        /* Стили для ползунка скорости */
        .speed-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            width: 100%;
            background: white;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .speed-control label { font-weight: bold; color: #333; font-size: 16px; }
        .speed-control input[type="range"] { width: 100%; cursor: pointer; }

        .camera-block { display: flex; flex-direction: column; align-items: center; gap: 15px; }
        .viewfinder {
            width: 400px; height: 300px; border: 3px dashed #ccc; border-radius: 12px;
            background-color: #ddd; display: flex; align-items: center; justify-content: center;
            overflow: hidden; color: #666;
        }
        .viewfinder img { width: 100%; height: 100%; object-fit: contain; }
        .cam-btn { font-size: 16px; padding: 12px 24px; background-color: #28a745; height: auto; }
    </style>
</head>
<body>

    <h1>Пульт управления роботом</h1>

    <div class="container">
        <div class="controls-block">
            <div class="joystick">
                <button class="empty"></button>
                <button onclick="sendCommand('l')">▲</button>
                <button class="empty"></button>

                <button onclick="sendCommand('b')">◀</button>
                <button class="stop-btn" onclick="sendCommand('s')">■</button>
                <button onclick="sendCommand('f')">▶</button>

                <button class="empty"></button>
                <button onclick="sendCommand('r')">▼</button>
                <button class="empty"></button>
            </div>

            <!-- Ползунок регулировки скорости -->
            <div class="speed-control">
                <label for="speed-slider">Скорость: <span id="speed-value">100</span></label>
                <input type="range" id="speed-slider" min="0" max="200" value="100" oninput="updateSpeed(this.value)">
            </div>
        </div>

        <div class="camera-block">
            <div class="viewfinder">
                <img id="robot-frame" src="" onerror="this.style.display='none'; document.getElementById('placeholder').style.display='block';" onload="this.style.display='block'; document.getElementById('placeholder').style.display='none';" alt="Кадр нейросети">
                <span id="placeholder" style="display: none;">Подключение к камере...</span>
            </div>
            <button class="cam-btn" onclick="restartStream()">🔄 Переподключить поток</button>
        </div>
    </div>

    <script>
        const ROBOT_BASE_URL = window.location.origin;
        let currentSpeed = 100;

        function updateSpeed(val) {
            currentSpeed = val;
            document.getElementById('speed-value').innerText = val;
        }

        function sendCommand(endpoint) {
            // Передаем скорость query-параметром для всех команд, кроме 's' (стоп)
            const url = endpoint === 's'
                ? `${ROBOT_BASE_URL}/${endpoint}`
                : `${ROBOT_BASE_URL}/${endpoint}?speed=${currentSpeed}`;

            fetch(url).catch(err => console.error(err));
        }

        function restartStream() {
            const img = document.getElementById('robot-frame');
            const placeholder = document.getElementById('placeholder');
            placeholder.innerText = "Переподключение...";
            placeholder.style.display = 'block';
            img.style.display = 'none';
            img.src = `${ROBOT_BASE_URL}/video_feed?t=${new Date().getTime()}`;
        }

        window.onload = restartStream;
    </script>
</body>
</html>
