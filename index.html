<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <style>
        body {
            margin: 0;
            padding: 0;
            background: white;
            font-family: sans-serif;
            touch-action: none; /* Важно для мобилок, чтобы не скроллилось */
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
        }
        .status {
            margin-top: 50px;
            font-size: 32px;
            font-weight: bold;
            color: black;
        }
        #zone_joystick {
            position: relative;
            width: 100%;
            height: 300px;
            margin-top: auto;
            margin-bottom: 50px;
            /* background: #f0f0f0;  Раскомментируйте, если нужно видеть зону */
        }
    </style>
</head>
<body>

    <div class="status" id="state">СТОИТ</div>
    <div id="zone_joystick"></div>

    <script>
        let lastCommand = "";
        const statusLabel = document.getElementById('state');

        // Инициализация джойстика
        const manager = nipplejs.create({
            zone: document.getElementById('zone_joystick'),
            mode: 'static',
            position: {left: '50%', top: '50%'},
            color: 'blue',
            size: 150
        });

        function send(cmd) {
            if (cmd !== lastCommand) {
                // Отправка запроса на робота
                fetch('/' + cmd).catch(e => console.log("Ошибка: Робот не в сети"));

                lastCommand = cmd;

                // Обновление текста
                if (cmd === 's') statusLabel.innerText = "СТОИТ";
                else if (cmd === 'f') statusLabel.innerText = "ВПЕРЕД";
                else if (cmd === 'b') statusLabel.innerText = "НАЗАД";
                else if (cmd === 'l') statusLabel.innerText = "ВЛЕВО";
                else if (cmd === 'r') statusLabel.innerText = "ВПРАВО";
            }
        }

        manager.on('move', (evt, data) => {
            if (!data.direction) return;

            const dir = data.direction.angle; // 'up', 'down', 'left', 'right'

            if (dir === 'up') send('f');
            else if (dir === 'down') send('b');
            else if (dir === 'left') send('l');
            else if (dir === 'right') send('r');
        });

        manager.on('end', () => {
            send('s');
        });
    </script>
</body>
</html>
